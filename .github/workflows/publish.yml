name: Publish to PyPI

on:
  push:
    branches:
      - modernize-python-build  # Change this to your specific branch name

jobs:
  build-and-publish:
    name: Build and publish Python 🐍 distribution 📦 to PyPI
    runs-on: ubuntu-latest
    
    # These permissions are mandatory for Trusted Publishing
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Build package
        run: uv build

      - name: Publish package
        # No token needed if Trusted Publishing is configured on PyPI
        run: uv publish