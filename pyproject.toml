[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "MIPLIBing"
version = "1.0.0"
description = "MIPLIBing is a library for downloading MIP benchmark instances."
readme = "README.md"
authors = [
  { name = "Thiago Serra", email = "Thiago.Serra@bucknell.edu" }
]
license = { text = "MIT" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Mathematics",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
keywords = ["mip", "benchmarks", "optimization"]
dependencies = [
    "lxml",
    "numpy",
    "pandas",
    "requests",
]
requires-python = ">=3.7"

[project.urls]
Homepage = "https://github.com/thserra/MIPLIBing"
"Bug Reports" = "https://github.com/thserra/MIPLIBing/issues"
Source = "https://github.com/thserra/MIPLIBing"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true
license-files = ["LICENSE.txt"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.wheel]
# Replacing universal=0 (which is the default for Python 3)
universal = false